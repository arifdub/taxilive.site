<!doctype html>
<html lang="en-IE">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Taxi Live Admin</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/style.css?v=6">
  <style>
    .admin { max-width: 860px; margin: 0 auto; padding: 32px 16px 80px; }
    .login { display: flex; gap: 10px; flex-wrap: wrap; margin: 16px 0 24px; }
    .login input { flex: 1 1 220px; font: inherit; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--text); }
    .arow { display: flex; gap: 14px; align-items: flex-start; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 10px; }
    .arow img { width: 84px; height: 64px; object-fit: cover; border-radius: 8px; flex: none; }
    .arow__main { flex: 1; min-width: 0; }
    .arow__main p { margin: 4px 0; color: var(--muted); font-size: .9rem; white-space: pre-line; overflow-wrap: anywhere; }
    .arow__btns { display: flex; flex-direction: column; gap: 6px; }
    .is-hidden { opacity: .55; }
    .flag { color: var(--red); font-weight: 700; font-size: .8rem; }
  </style>
</head>
<body>
  <div class="admin">
    <a href="./" class="brand" style="color:var(--text)"><img src="assets/logo.svg" alt="" class="brand__logo"><span class="brand__name">Taxi<span>Live</span> admin</span></a>
    <form class="login" id="login">
      <input type="password" id="pw" placeholder="Admin password" autocomplete="current-password" required>
      <button class="btn btn--primary" type="submit">Show posts</button>
    </form>
    <p id="msg" class="muted"></p>
    <div id="list"></div>
  </div>
  <div class="toast" id="toast"></div>
  <script>
  (function () {
    var API = "api/posts.php", pw = "";
    var list = document.getElementById("list"), msg = document.getElementById("msg");
    function call(action, extra) {
      var fd = new FormData();
      fd.append("action", action); fd.append("password", pw);
      for (var k in extra || {}) fd.append(k, extra[k]);
      return fetch(API, { method: "POST", body: fd }).then(function (r) {
        return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || "Error"); return j; });
      });
    }
    function el(t, c, x) { var e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; }
    function load() {
      call("admin_list").then(function (j) {
        list.innerHTML = "";
        msg.textContent = j.posts.length + " post(s). Hidden posts are not shown on the site.";
        j.posts.forEach(function (p) {
          var row = el("div", "arow" + (p.hidden ? " is-hidden" : ""));
          if (p.image) { var i = el("img"); i.src = p.image; i.alt = ""; row.appendChild(i); }
          var m = el("div", "arow__main");
          m.appendChild(el("strong", "", "[" + p.type + "] " + p.title));
          m.appendChild(el("p", "", p.body));
          m.appendChild(el("p", "", p.name + (p.phone ? " · " + p.phone : "") + (p.area ? " · " + p.area : "") + " · " + new Date(p.created * 1000).toLocaleString("en-IE")));
          if (p.reports) m.appendChild(el("span", "flag", "⚑ " + p.reports + " report(s)" + (p.hidden ? " – hidden" : "")));
          else if (p.hidden) m.appendChild(el("span", "flag", "Hidden"));
          row.appendChild(m);
          var b = el("div", "arow__btns");
          var t = el("button", "btn btn--sm btn--ghost-dark", p.hidden ? "Show" : "Hide");
          t.onclick = function () { call("admin_toggle", { id: p.id }).then(load); };
          var d = el("button", "btn btn--sm btn--call", "Delete");
          d.onclick = function () { if (confirm("Delete permanently?")) call("admin_delete", { id: p.id }).then(load); };
          b.appendChild(t); b.appendChild(d); row.appendChild(b);
          list.appendChild(row);
        });
      }).catch(function (e) { list.innerHTML = ""; msg.textContent = e.message; });
    }
    document.getElementById("login").addEventListener("submit", function (e) {
      e.preventDefault(); pw = document.getElementById("pw").value; load();
    });
  })();
  </script>
</body>
</html>
